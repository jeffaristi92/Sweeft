name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch: {}   # allow manual test runs (builds only, no publish)

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rids: win-x64
          - os: ubuntu-latest
            rids: linux-x64
          # Apple Silicon runner cross-compiles BOTH macOS architectures,
          # so we don't depend on the scarce macOS Intel (macos-13) runners.
          - os: macos-latest
            rids: osx-arm64 osx-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install NativeAOT prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish + package (NativeAOT)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0-dev"; fi
          mkdir -p dist
          for rid in ${{ matrix.rids }}; do
            echo "::group::publish $rid"
            dotnet publish src/Sweeft.Console/Sweeft.Console.csproj \
              -c Release -r "$rid" -p:Version="$VER" -o "publish/$rid"
            NAME="sweeft-${VER}-${rid}"
            if [ "$rid" = "win-x64" ]; then
              ( cd "publish/$rid" && 7z a "../../dist/${NAME}.zip" sweeft.exe )
            else
              chmod +x "publish/$rid/sweeft"
              tar -C "publish/$rid" -czf "dist/${NAME}.tar.gz" sweeft
            fi
            echo "::endgroup::"
          done
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
